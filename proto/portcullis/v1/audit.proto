syntax = "proto3";

package portcullis.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/aportcullis/portcullis/gen/portcullis/v1;portcullisv1";

// Audit exposes the append-only audit trail for reading. Listing and a single
// event's detail have distinct permissions (ADR-0008), enforced inline in the
// handler.
service Audit {
  // List returns a page of audit events (OFFSET pagination, PRD §7.1). Requires
  // audit.list.
  rpc List(AuditListRequest) returns (AuditListResponse) {}
  // Get returns one audit event's detail. Requires audit.get.
  rpc Get(GetAuditEventRequest) returns (GetAuditEventResponse) {}
}

message AuditListRequest {
  // 1-based page number; 0 or 1 selects the first page.
  uint32 page = 1;
  // Rows per page; must be one of {10, 20, 50, 100}. Any other value selects the
  // default (20). Capped at 100 (PRD §7.1).
  uint32 page_size = 2;
  // Optional sort; unset selects occurred_at descending. An off-whitelist field
  // is rejected with InvalidArgument.
  AuditSort sort = 3;
}

// AuditSort names a sortable column (whitelisted server-side) and a direction.
message AuditSort {
  // Whitelisted column, e.g. "occurred_at". An unknown value is rejected.
  string field = 1;
  // true = descending (newest/largest first). Optional so that UNSET is
  // distinguishable from an explicit false: unset keeps the server default
  // (descending), and only an explicit false selects ascending. A plain proto3
  // bool cannot express that distinction (implicit field presence).
  optional bool descending = 2;
}

// AuditEvent is one record of the trail. It carries the populated core fields;
// execution/state/digest columns are added with the features that fill them.
message AuditEvent {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // "user" | "system" | "service".
  string actor_type = 3;
  // The acting user's id (empty for a system/service or unattributed actor).
  string actor_user_id = 4;
  // Stable id of a non-human actor (empty for a user actor).
  string actor_service = 5;
  // Stable UPPER_SNAKE action key, e.g. "AUTH_LOGIN".
  string action = 6;
  // Kind of the target entity (empty when the event has no target).
  string target_type = 7;
  string target_id = 8;
  // "SUCCEEDED" | "FAILED".
  string outcome = 9;
  // Resolved client IP (empty when unavailable).
  string source_ip = 10;
  // Correlates the event with the request log (empty when unavailable).
  string request_id = 11;
  // Non-sensitive supplemental fields (never secrets, tokens, or result rows).
  google.protobuf.Struct metadata = 12;
}

// AuditEventSummary is deliberately safe for audit.list. Correlation data,
// network addresses, and supplemental metadata are available only through
// audit.get, preserving ADR-0008's collection/detail permission boundary.
message AuditEventSummary {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_type = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string outcome = 7;
}

message AuditListResponse {
  // The page of events (newest first by default).
  repeated AuditEventSummary events = 1;
  // Echoes the effective (clamped) page and page size the server applied.
  uint32 page = 2;
  uint32 page_size = 3;
  // Total matching rows and the derived page count, for explicit page controls
  // ("1–20 of 1,340", page jump) (PRD §7.1).
  uint64 total_count = 4;
  uint32 total_pages = 5;
}

message GetAuditEventRequest {
  string id = 1;
}

message GetAuditEventResponse {
  AuditEvent event = 1;
}
