name: portcullis

# Run `docker compose up --build` and open http://localhost:8080.
# Persist the master key across restarts; production uses a managed secret and persistent database.

services:
  postgres:
    # Keep this digest aligned with dbtest and browser E2E.
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: portcullis
      POSTGRES_PASSWORD: portcullis
      POSTGRES_DB: portcullis
    volumes:
      - pgdata:/var/lib/postgresql
      # Init scripts run only on an empty data volume.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portcullis -d portcullis"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Generate the key only if absent; replacing it makes sealed data unreadable.
  keygen:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: ["sh", "-c", "[ -s /secrets/master.key ] || head -c 32 /dev/urandom | base64 > /secrets/master.key"]
    volumes:
      - secrets:/secrets

  # Keep owner credentials in the one-shot migration process (ADR-0009).
  migrate:
    build:
      context: .
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTCULLIS_MIGRATE_DATABASE_URL: postgres://portcullis:portcullis@postgres:5432/portcullis?sslmode=disable

  portcullis:
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
    environment:
      # Runtime credentials cannot mutate audit evidence or schema.
      PORTCULLIS_DATABASE_URL: postgres://portcullis_app:portcullis@postgres:5432/portcullis?sslmode=disable
      PORTCULLIS_MASTER_KEY_FILE: /secrets/master.key
    volumes:
      - secrets:/secrets:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
  secrets:
