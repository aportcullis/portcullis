name: Database compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.family }} compatibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: '16'
            preview: false
          - family: '17'
            preview: false
          - family: '18'
            preview: false
          - family: '19'
            preview: true # Beta evidence; requalify final GA before removing this flag.
    env:
      PORTCULLIS_TEST_POSTGRES_FAMILY: ${{ matrix.family }}
      PORTCULLIS_TEST_DATABASE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
      - name: Verify selected target family and dialect scenarios
        run: go test -p 1 -count=1 ./internal/infra/dbtest ./internal/infra/pgdialect
      - name: Verify browser workflows with PG18 metadata and the selected target
        run: make e2e
