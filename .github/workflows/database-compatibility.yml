name: Database compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.family }} compatibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: '16'
            preview: false
          - family: '17'
            preview: false
          - family: '18'
            preview: false
          - family: '19'
            preview: true # Beta evidence; requalify final GA before removing this flag.
    env:
      PORTCULLIS_TEST_POSTGRES_FAMILY: ${{ matrix.family }}
      PORTCULLIS_TEST_DATABASE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
      - name: Verify selected target family and dialect scenarios
        run: go test -count=1 ./internal/infra/dbtest ./internal/infra/pgdialect
      - name: Verify browser workflows with PG18 metadata and the selected target
        run: make e2e
