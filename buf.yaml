version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # The published service, request and response names predate linting; renaming them is a breaking API change (ADR-0029).
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
