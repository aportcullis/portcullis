# Install with `make hooks`; CI remains the required gate because local hooks can be bypassed.
pre-commit:
  commands:
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
      fail_text: "Go files need gofmt — run: gofmt -w ."

pre-push:
  commands:
    verify:
      run: make verify
