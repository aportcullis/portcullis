[changelog]
header = """
# Changelog

Generated from reviewed Git history with git-cliff. Unreleased entries describe development changes, not milestone acceptance; see the [roadmap](docs/roadmap.md) for product status.

"""
body = """
{% if version %}
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/aportcullis/portcullis/commit/{{ commit.id }})){% if commit.breaking_description %} — {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
topo_order = true
sort_commits = "newest"
commit_parsers = [
  { message = '^Merge ', skip = true },
  { message = '^chore\(changelog\)', skip = true },
  { message = '^(feat|fix|perf|refactor)\((security|auth|crypto|rotation)\)', group = "Security" },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^docs', group = "Documentation" },
  { message = '^(build|ci|chore|refactor|style|test)', group = "Maintenance" },
  { message = '.*', group = "Other" },
]
