version: v2
clean: true
# Local plugins run offline at exactly the runtime versions in go.mod and web/package.json (ADR-0029).
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  # protobuf-es v2 includes service descriptors; Connect-ES needs no separate plugin.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
