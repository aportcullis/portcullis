version: v2
clean: true
plugins:
  # Go server (protobuf-go + connect-go)
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  # TypeScript client for the frontend (protobuf-es + connect-es)
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
  - remote: buf.build/connectrpc/es
    out: web/src/gen
    opt: target=ts
