version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen
    opt: paths=source_relative
  # protobuf-es v2 includes service descriptors; Connect-ES needs no separate plugin.
  - remote: buf.build/bufbuild/es:v2.12.1
    out: web/src/gen
    opt: target=ts
