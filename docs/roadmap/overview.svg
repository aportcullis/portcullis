<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 872" role="img" aria-labelledby="title desc">
<title id="title">Portcullis roadmap</title>
<desc id="desc">M0 Foundation is the baseline. Gate M1 passed the complete correctness gate with Docker-hosted Chromium, including native CSV saving and readback. Bridge M2 follows Gate with browser WebMCP query assistance first and MySQL/SQLite parity afterward, then Library M3 completes MVP. Watch M4, Forge M5 and Reach M6 follow MVP. Horizon M7 contains exploratory candidates without delivery commitments.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif} .label{font-size:12px;font-weight:700;letter-spacing:1.6px} .copy{font-size:16px} .name{font-size:29px;font-weight:750} .small{font-size:13px}</style>
<rect width="1184" height="872" rx="24" fill="#F5F4EF"/>
<text x="40" y="44" class="label" fill="#147D82">PORTCULLIS / PUBLIC ROADMAP</text>
<text x="40" y="90" fill="#102A36" font-size="34" font-weight="750">From governed access to reusable analysis.</text>
<text x="40" y="120" class="copy" fill="#102A36">Outcome-led milestones. Dependencies before dates. Updated 2026-10-03.</text>
<rect x="40" y="146" width="1104" height="62" rx="16" fill="#E4EAE7" stroke="none"/>
<text x="60" y="172" class="label" fill="#102A36">M0 / FOUNDATION</text>
<text x="60" y="193" class="small" fill="#102A36">Baseline established: identity, permissions, secrets, sessions and audit. Not a separate release.</text>
<text x="40" y="244" class="label" fill="#147D82">ALPHA TO MVP</text>
<rect x="40" y="260" width="344" height="192" rx="16" fill="#102A36" stroke="none"/>
<text x="62" y="289" class="label" fill="#74D5C7">M1 / VERIFIED</text>
<text x="62" y="329" class="name" fill="#F5F4EF">Gate</text>
<text x="62" y="360" class="copy" fill="#D7EFE8">PostgreSQL request to execution</text>
<text x="62" y="383" class="copy" fill="#D7EFE8">Distinct review. One execution.</text>
<text x="62" y="406" class="copy" fill="#D7EFE8">Exact results and durable evidence.</text>
<text x="62" y="434" class="small" fill="#F5F4EF">FIRST POSTGRESQL ALPHA / VERIFIED</text>
<rect x="420" y="260" width="344" height="192" rx="16" fill="#FFFFFF" stroke="#D7DFDC"/>
<text x="442" y="289" class="label" fill="#147D82">M2 / NEXT AFTER M1</text>
<text x="442" y="329" class="name" fill="#102A36">Bridge</text>
<text x="442" y="360" class="copy" fill="#52646B">WebMCP query assistance first</text>
<text x="442" y="383" class="copy" fill="#52646B">Then MySQL and SQLite parity</text>
<text x="442" y="406" class="copy" fill="#52646B">Governed requests, runs and results</text>
<text x="442" y="434" class="small" fill="#102A36">DEPENDS ON GATE</text>
<rect x="800" y="260" width="344" height="192" rx="16" fill="#FFFFFF" stroke="#D7DFDC"/>
<text x="822" y="289" class="label" fill="#147D82">M3 / PLANNED</text>
<text x="822" y="329" class="name" fill="#102A36">Library</text>
<text x="822" y="360" class="copy" fill="#52646B">Saved queries and versions</text>
<text x="822" y="383" class="copy" fill="#52646B">Favorites, sharing and parameters</text>
<text x="822" y="406" class="copy" fill="#52646B">Results across all three databases</text>
<text x="822" y="434" class="small" fill="#102A36">MVP / AFTER BRIDGE</text>
<path d="M392 353h16m-6-6 6 6-6 6" fill="none" stroke="#147D82" stroke-width="2"/>
<path d="M772 353h16m-6-6 6 6-6 6" fill="none" stroke="#147D82" stroke-width="2"/>
<rect x="40" y="468" width="1104" height="46" rx="10" fill="#D7EFE8" stroke="none"/>
<text x="60" y="497" class="copy" fill="#102A36">NEXT: browser WebMCP query assistance, then MySQL and SQLite parity.</text>
<text x="40" y="548" class="label" fill="#147D82">AFTER MVP</text>
<rect x="40" y="564" width="344" height="192" rx="16" fill="#FFFFFF" stroke="#D7DFDC"/>
<text x="62" y="593" class="label" fill="#147D82">M4 / PLANNED</text>
<text x="62" y="633" class="name" fill="#102A36">Watch</text>
<text x="62" y="664" class="copy" fill="#52646B">Temporary access and console</text>
<text x="62" y="687" class="copy" fill="#52646B">Multistage approval and EXPLAIN</text>
<text x="62" y="710" class="copy" fill="#52646B">Broader identity integration</text>
<text x="62" y="738" class="small" fill="#102A36">PER-STATEMENT GOVERNANCE</text>
<rect x="420" y="564" width="344" height="192" rx="16" fill="#FFFFFF" stroke="#D7DFDC"/>
<text x="442" y="593" class="label" fill="#147D82">M5 / PLANNED</text>
<text x="442" y="633" class="name" fill="#102A36">Forge</text>
<text x="442" y="664" class="copy" fill="#52646B">Git-sourced schema changes</text>
<text x="442" y="687" class="copy" fill="#52646B">Atlas status, dry-run and apply</text>
<text x="442" y="710" class="copy" fill="#52646B">Immutable review and approvals</text>
<text x="442" y="738" class="small" fill="#102A36">AFTER ACCESS MILESTONE</text>
<rect x="800" y="564" width="344" height="192" rx="16" fill="#FFFFFF" stroke="#D7DFDC"/>
<text x="822" y="593" class="label" fill="#147D82">M6 / PLANNED</text>
<text x="822" y="633" class="name" fill="#102A36">Reach</text>
<text x="822" y="664" class="copy" fill="#52646B">Helm and CloudNativePG</text>
<text x="822" y="687" class="copy" fill="#52646B">Terraform / OpenTofu integration</text>
<text x="822" y="710" class="copy" fill="#52646B">Stable APIs and operator contracts</text>
<text x="822" y="738" class="small" fill="#102A36">PROVIDERS AFTER API STABILITY</text>
<path d="M392 657h16m-6-6 6 6-6 6" fill="none" stroke="#98ADA6" stroke-width="2"/>
<path d="M772 657h16m-6-6 6 6-6 6" fill="none" stroke="#98ADA6" stroke-width="2"/>
<rect x="40" y="780" width="1104" height="62" rx="16" fill="#E4EAE7" stroke="none"/>
<text x="60" y="805" class="label" fill="#102A36">M7 / HORIZON / EXPLORATION</text>
<text x="60" y="828" class="small" fill="#102A36">BI charts + dashboards, GitOps, discovery, SIEM, AI Review and remote Agent Gateway. No delivery commitments.</text>
</svg>
